name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      - run: pnpm test

  # Runs after `test` passes on a push to main. Only maintains the Version
  # Packages PR (bump + changelog) — it never touches npm or the OIDC token,
  # so it stays ungated. The actual publish lives entirely in release.yml,
  # kept as its own tag-triggered workflow because npm's Trusted Publisher
  # registration is bound to that exact filename (see release.yml for why).
  #
  # Once the Version Packages PR is merged (no changesets left to consume),
  # this job tags the release and dispatches release.yml against that tag.
  # `git push` here uses GITHUB_TOKEN, and GitHub does not let GITHUB_TOKEN-
  # authored pushes trigger downstream workflows (to prevent infinite
  # recursion) — so the plain tag push alone would never fire release.yml.
  # workflow_dispatch is the documented exception to that restriction, hence
  # the explicit `gh workflow run` below instead of relying on the tag push.
  version:
    name: Version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two pushes to main landing close together must not run this job
    # concurrently: both would race to push to the changeset-release/main
    # branch or to tag the same release twice.
    concurrency:
      group: version-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write # required for `gh workflow run` to dispatch release.yml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        id: changesets
        # Pinned to a commit, not the `v1` tag: this job holds contents:write
        # and pull-requests:write, so a compromised/re-pointed moving ref here
        # has outsized blast radius. `v1` is actually a force-pushed branch
        # upstream (not an immutable tag), so pinning matters even more than
        # usual. v1 branch head as of 2026-07-30.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release and hand off to release.yml
        # hasChangesets is false both right after the Version Packages PR is
        # merged (something new to release) AND on any ordinary changeset-less
        # merge (nothing new — this version is already tagged). `changeset tag`
        # is idempotent and no-ops in the latter case, so `git describe` finds
        # no tag at HEAD; treat that as "nothing to release" rather than an
        # error (bash's default -e would otherwise fail this step, and the
        # whole job, on every ordinary merge).
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset tag
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No new tag at HEAD — this version was already released. Nothing to do."
            exit 0
          fi
          git push origin "refs/tags/$TAG"
          gh workflow run release.yml --ref "$TAG"
