name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      - run: pnpm test

  # Maintains the Version Packages PR only — no npm access, so it stays
  # ungated. Publishing itself lives in release.yml (see there for why it's a
  # separate file). Once merged, this job tags the release and dispatches
  # release.yml via workflow_dispatch, since GITHUB_TOKEN-authored pushes
  # don't trigger other workflows.
  version:
    name: Version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize runs so overlapping pushes to main can't race on the
    # Version PR branch or double-tag.
    concurrency:
      group: version-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write # required for `gh workflow run` to dispatch release.yml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        # Pinned to a commit: this job holds contents/pull-requests write, and
        # `v1` is a force-pushed branch upstream, not an immutable tag.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release and hand off to release.yml
        # Runs unconditionally, not gated on hasChangesets: GitHub's
        # concurrency queue keeps only the latest pending run per group and
        # drops the rest (not a FIFO queue), so the specific run for a
        # Version-PR-merge commit can be cancelled before it executes. Any
        # later run reaching this step will still see that commit's version
        # bump in its checkout and can catch up. `changeset tag` is
        # idempotent — a no-op if the current version is already tagged — so
        # this is safe to run on every push; `git describe` then finds no tag
        # to act on, which we treat as "nothing to release" rather than an
        # error (bash's default -e would otherwise fail the step).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset tag
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No new tag at HEAD — this version was already released. Nothing to do."
            exit 0
          fi
          git push origin "refs/tags/$TAG"
          gh workflow run release.yml --ref "$TAG"
